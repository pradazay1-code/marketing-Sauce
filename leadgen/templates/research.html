{% extends "_layout.html" %}
{% set active = 'research' %}
{% block title %}Deep Research — AventisAI{% endblock %}

{# extra_css is injected inside the layout's own <style> tag — raw CSS only. #}
{% block extra_css %}
  .rhead { margin-bottom:22px; }
  .rhead h2 { font-size:24px; color:#f8fafc; margin:0 0 4px; }
  .rhead .lede { font-size:13.5px; color:#94a3b8; }
  .rg { display:grid; gap:18px; }
  .panel { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:20px; }
  .panel h2 { font-size:15px; font-weight:700; color:#f8fafc; margin-bottom:4px; }
  .panel .sub { font-size:12.5px; color:#94a3b8; margin-bottom:16px; line-height:1.5; }

  .integ { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .chip { display:inline-flex; align-items:center; gap:7px; padding:6px 13px; border-radius:100px;
          font-size:12px; font-weight:600; border:1px solid; }
  .chip.on  { background:rgba(34,197,94,.12); border-color:#22c55e; color:#4ade80; }
  .chip.off { background:rgba(148,163,184,.1); border-color:#475569; color:#94a3b8; }
  .dot { width:7px; height:7px; border-radius:50%; background:currentColor; }

  .field { margin-bottom:14px; }
  .field label { display:block; font-size:11.5px; font-weight:700; text-transform:uppercase;
                 letter-spacing:.8px; color:#94a3b8; margin-bottom:6px; }
  select, input[type=text], input[type=number] {
    width:100%; background:#0f172a; border:1px solid #334155; border-radius:8px;
    padding:10px 12px; color:#e2e8f0; font-size:13.5px; font-family:inherit; }
  select:focus, input:focus { outline:none; border-color:#3b82f6; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .btn { background:#3b82f6; color:#fff; border:none; border-radius:8px; padding:11px 20px;
         font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn:hover { background:#2563eb; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn.ghost { background:transparent; border:1px solid #475569; color:#cbd5e1; }
  .btn.ghost:hover { background:#334155; }

  .ind-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:10px; }
  .ind { background:#0f172a; border:1px solid #334155; border-radius:9px; padding:13px; }
  .ind.focus { border-color:#3b82f6; }
  .ind .name { font-size:13px; font-weight:700; color:#f1f5f9; margin-bottom:3px; }
  .ind .meta { font-size:11px; color:#64748b; margin-bottom:7px; }
  .ind .why  { font-size:11.5px; color:#94a3b8; line-height:1.5; }
  .badge { display:inline-block; font-size:9.5px; font-weight:700; letter-spacing:.6px;
           text-transform:uppercase; padding:2px 7px; border-radius:4px;
           background:rgba(59,130,246,.15); color:#60a5fa; margin-left:6px; }

  .out { margin-top:16px; background:#0f172a; border:1px solid #334155; border-radius:9px;
         padding:15px; font-size:13px; color:#cbd5e1; max-height:440px; overflow-y:auto; }
  .out:empty { display:none; }
  .line { padding:7px 0; border-bottom:1px solid #1e293b; }
  .line:last-child { border-bottom:none; }
  .ok { color:#4ade80; } .warn { color:#fbbf24; } .bad { color:#f87171; } .dim { color:#64748b; }

  .score { display:inline-block; min-width:42px; text-align:center; padding:3px 9px;
           border-radius:6px; font-weight:800; font-size:12.5px; }
  .s-a { background:rgba(239,68,68,.16); color:#f87171; }
  .s-b { background:rgba(249,115,22,.16); color:#fb923c; }
  .s-c { background:rgba(234,179,8,.16); color:#facc15; }
  .s-d { background:rgba(148,163,184,.14); color:#94a3b8; }
  .s-f { background:rgba(34,197,94,.14); color:#4ade80; }

  table.bd { width:100%; border-collapse:collapse; font-size:13px; }
  table.bd th { text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.7px;
                color:#64748b; padding:7px 0; border-bottom:1px solid #334155; }
  table.bd td { padding:9px 0; border-bottom:1px solid #1e293b; color:#cbd5e1; }
  .bar { height:5px; background:#334155; border-radius:3px; overflow:hidden; width:88px; }
  .bar span { display:block; height:100%; background:#3b82f6; }

  .prog { margin-top:14px; }
  .pbar { height:6px; background:#334155; border-radius:4px; overflow:hidden; }
  .pbar span { display:block; height:100%; width:0; background:#3b82f6; transition:width .25s; }
  .pnote { font-size:12px; color:#94a3b8; margin-top:7px; font-variant-numeric:tabular-nums; }

  .conf { display:inline-block; min-width:38px; text-align:center; padding:3px 8px;
          border-radius:6px; font-weight:800; font-size:12px; }
  .c-hi  { background:rgba(34,197,94,.16);  color:#4ade80; }
  .c-mid { background:rgba(234,179,8,.16);  color:#facc15; }
  .c-lo  { background:rgba(148,163,184,.14);color:#94a3b8; }
  .srcs { font-size:11px; color:#64748b; }
  .flag { font-size:11px; color:#fbbf24; }
{% endblock %}

{% block content %}
<div class="rhead">
  <h2>Deep Research</h2>
  <div class="lede">Find businesses that need marketing — and know exactly why before you call</div>
</div>

<div class="rg">

  <div class="integ">
    <span class="chip {{ 'on' if integrations.firecrawl.configured else 'off' }}">
      <span class="dot"></span> Firecrawl
      {{ 'connected' if integrations.firecrawl.configured else 'set FIRECRAWL_API_KEY' }}
    </span>
    <span class="chip {{ 'on' if integrations.mapbox.configured else 'off' }}">
      <span class="dot"></span> Mapbox
      {{ 'connected' if integrations.mapbox.configured else 'set MAPBOX_ACCESS_TOKEN' }}
    </span>
    {% if integrations.mapbox.configured and integrations.mapbox.permanent %}
    <span class="chip on"><span class="dot"></span> Permanent geocoding</span>
    {% endif %}
  </div>

  <!-- ================= CREDIT BUDGET ================= -->
  <div class="panel" id="budgetPanel">
    <h2>Credit budget</h2>
    <div class="sub">
      Nothing in this app calls a paid API without checking here first. Set
      <code>FIRECRAWL_CREDIT_BUDGET</code> to your remaining balance and a run
      that cannot afford to finish will refuse to start.
    </div>
    <div id="budgetBody" class="dim">Loading…</div>
  </div>

  <!-- ================= NEWLY LICENSED ================= -->
  <div class="panel">
    <h2>Newly licensed agents <span class="badge">Free</span></h2>
    <div class="sub">
      State licensing boards publish licence issue dates publicly. An agent
      licensed last month has a commission budget, no brand, no website, and no
      marketing support from their brokerage — the highest-urgency segment in
      the taxonomy, and nobody works it systematically.
      <br><br>
      <strong>This reads the board over plain HTTP first, which costs nothing.</strong>
      Firecrawl is only used if you explicitly allow it, and never past the cap
      you set.
    </div>

    <div class="row">
      <div class="field">
        <label>State</label>
        <select id="lState"><option>MA</option><option>RI</option><option>CT</option></select>
      </div>
      <div class="field">
        <label>Licensed within</label>
        <select id="lDays">
          <option value="30">Last 30 days</option>
          <option value="90" selected>Last 90 days</option>
          <option value="180">Last 6 months</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Result pages</label>
        <input type="number" id="lPages" value="1" min="1" max="5">
      </div>
      <div class="field">
        <label>If free access fails</label>
        <select id="lCredits">
          <option value="0" selected>Stop — never spend credits</option>
          <option value="2">Allow up to 2 credits</option>
          <option value="5">Allow up to 5 credits</option>
        </select>
      </div>
    </div>

    <button class="btn ghost" onclick="probeBoard()">Test connection (free)</button>
    <button class="btn" id="lBtn" onclick="importLicensees()">Import licensees</button>
    <div class="out" id="lOut"></div>
  </div>

  <!-- ================= DISCOVER ================= -->
  <div class="panel">
    <h2>Find new prospects — multi-source consensus</h2>
    <div class="sub">
      Queries every configured source across several search terms, then clusters
      the results into one record per real business and scores each by how many
      independent sources corroborate it. A business four sources agree on is a
      far better lead than one a single web search saw. Everything is
      deduplicated against the whole CRM before it is saved.
    </div>

    <div id="srcChips" class="integ" style="margin-bottom:16px"></div>

    <div class="row">
      <div class="field">
        <label>Industry</label>
        <select id="dIndustry">
          {% for i in industries %}
          <option value="{{ i.key }}">{{ i.label }}{% if i.focus %} ★{% endif %}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label>State</label>
        <select id="dState"><option>MA</option><option>RI</option><option>CT</option></select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>City / Town</label>
        <input type="text" id="dCity" placeholder="Brockton" value="Brockton">
      </div>
      <div class="field">
        <label>Search terms per industry</label>
        <input type="number" id="dTerms" value="3" min="1" max="6">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Confidence mode</label>
        <select id="dMode">
          <option value="balanced" selected>Balanced — good signal, good volume</option>
          <option value="strict">Strict — only well-corroborated businesses</option>
          <option value="wide">Wide — maximum volume, expect noise</option>
        </select>
      </div>
      <div class="field">
        <label>Minimum sources per lead</label>
        <select id="dMinSources">
          <option value="1" selected>1 — keep single-source finds</option>
          <option value="2">2 — require corroboration</option>
          <option value="3">3 — heavily corroborated only</option>
        </select>
      </div>
    </div>

    <button class="btn" id="dBtn" onclick="discover()">Run consensus search</button>
    <div class="prog" id="dProg" style="display:none">
      <div class="pbar"><span id="pFill"></span></div>
      <div class="pnote" id="pNote"></div>
    </div>
    <div class="out" id="dOut"></div>
  </div>

  <!-- ================= AUDIT ================= -->
  <div class="panel">
    <h2>Audit unresearched leads</h2>
    <div class="sub">
      For each lead: finds their website, scrapes it, and scores how badly they
      need marketing — mobile, SSL, tracking, forms, reviews, content, social.
      Highest ICP scores are researched first. Five at a time, because each lead
      costs a search plus a scrape.
    </div>
    <div class="row">
      <div class="field">
        <label>Industry filter</label>
        <select id="aIndustry">
          <option value="">All industries</option>
          {% for i in industries %}<option value="{{ i.key }}">{{ i.label }}</option>{% endfor %}
        </select>
      </div>
      <div class="field">
        <label>Batch size</label>
        <input type="number" id="aLimit" value="5" min="1" max="5">
      </div>
    </div>
    <button class="btn" id="aBtn" onclick="runAudit()">Research next batch</button>
    <button class="btn ghost" onclick="classifyAll()">Backfill industries</button>
    <button class="btn ghost" onclick="findDupes()">Scan for duplicates</button>
    <div class="out" id="aOut"></div>
  </div>

  <!-- ================= BREAKDOWN ================= -->
  <div class="panel">
    <h2>Portfolio by industry</h2>
    <div class="sub">Average need score — higher means more of that industry needs help.</div>
    <table class="bd">
      <thead><tr><th>Industry</th><th>Leads</th><th>Avg need</th><th></th></tr></thead>
      <tbody id="bdBody">
        {% for b in breakdown %}
        <tr>
          <td>{{ b.industry.replace('_',' ').title() }}</td>
          <td>{{ b.count }}</td>
          <td>{{ b.avg_need }}</td>
          <td><div class="bar"><span style="width:{{ b.avg_need }}%"></span></div></td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="dim">No leads yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <!-- ================= REFERENCE ================= -->
  <div class="panel">
    <h2>Target industries</h2>
    <div class="sub">★ marks the three this CRM is tuned for.</div>
    <div class="ind-grid">
      {% for i in industries %}
      <div class="ind {{ 'focus' if i.focus }}">
        <div class="name">{{ i.label }}{% if i.focus %}<span class="badge">Focus</span>{% endif %}</div>
        <div class="meta">Peak: {{ i.seasonal_peak or '—' }} · ICP {{ i.icp_weight }}</div>
        <div class="why">{{ i.why }}</div>
      </div>
      {% endfor %}
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
function gradeClass(g){ return 's-' + (g||'f').toLowerCase(); }
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
function out(el, html){ document.getElementById(el).innerHTML = html; }
function busy(id, on, label){
  const b=document.getElementById(id); b.disabled=on; b.textContent = on ? 'Working…' : label;
}

// ---- source status chips ----
async function loadSources(){
  try {
    const d = await (await fetch('/api/research/sources')).json();
    document.getElementById('srcChips').innerHTML = (d.sources||[]).map(s =>
      `<span class="chip ${s.configured?'on':'off'}"><span class="dot"></span>
       ${esc(s.name.replace(/_/g,' '))} ${s.configured?'ready':'add '+esc(s.env||'key')}</span>`
    ).join('');
  } catch(e){ /* chips are cosmetic */ }
}
loadSources();

// ---- credit budget ----
async function loadBudget(){
  try {
    const d = await (await fetch('/api/research/budget')).json();
    const s = d.status;
    const cls = s.remaining <= 5 ? 'bad' : s.remaining <= 20 ? 'warn' : 'ok';
    let h = `<div class="line"><span class="${cls}" style="font-size:19px;font-weight:800">
             ${s.remaining}</span> <span class="dim">of ${s.budget} credits left
             this month (${s.pct_used}% used)</span></div>`;
    if (d.cache && d.cache.entries)
      h += `<div class="line dim">Cache holds ${d.cache.entries} page${d.cache.entries===1?'':'s'}
            — re-scraping any of them costs nothing.</div>`;
    if ((d.by_feature||[]).length){
      h += `<div class="line dim" style="margin-top:6px">Spent on:</div>`;
      d.by_feature.forEach(f => h +=
        `<div class="line">${esc(f.feature.replace(/_/g,' '))}
         <span class="dim"> — ${f.credits} credit${f.credits===1?'':'s'} over ${f.calls} call${f.calls===1?'':'s'}</span></div>`);
    } else {
      h += `<div class="line ok">No credits spent yet this month.</div>`;
    }
    document.getElementById('budgetBody').innerHTML = h;
  } catch(e){
    document.getElementById('budgetBody').innerHTML =
      '<span class="dim">Budget unavailable.</span>';
  }
}
loadBudget();

// ---- licensing boards ----
async function probeBoard(){
  out('lOut', '<div class="line dim">Testing the board over plain HTTP…</div>');
  try {
    const d = await (await fetch('/api/research/licenses/probe', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({state: lState.value})})).json();
    let h = `<div class="line ${d.ok?'ok':'warn'}">${esc(d.verdict||'')}</div>`;
    h += `<div class="line dim">${esc(d.label||'')} · ${d.bytes||0} bytes ·
          ${d.credits_spent||0} credits</div>`;
    if (d.url) h += `<div class="line dim mono" style="font-size:11px">${esc(d.url)}</div>`;
    (d.sample||[]).forEach(r => h +=
      `<div class="line">${esc(r.name)} <span class="dim">— ${esc(r.city||'?')},
       issued ${esc(r.issue_date||'unknown')}</span></div>`);
    if (!d.ok && d.portal) h += `<div class="line" style="margin-top:6px">
      <a href="${esc(d.portal)}" target="_blank" rel="noopener" style="color:#60a5fa">
      Open the board manually →</a> <span class="dim">then set LICENSE_BOARDS with a
      working URL.</span></div>`;
    out('lOut', h);
  } catch(e){ out('lOut','<div class="line bad">Probe failed</div>'); }
}

async function importLicensees(){
  busy('lBtn', true);
  out('lOut', '<div class="line dim">Reading the licensing board…</div>');
  const maxCredits = parseInt(lCredits.value)||0;
  try {
    const r = await fetch('/api/research/licenses', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({state:lState.value, days:parseInt(lDays.value)||90,
                            pages:parseInt(lPages.value)||1,
                            allow_credits: maxCredits>0, max_credits: maxCredits})});
    const d = await r.json();
    if (d.error) {
      out('lOut', `<div class="line bad">${esc(d.error)}</div>` +
        (d.budget ? `<div class="line dim">${d.budget.remaining} credits left</div>` : ''));
      return;
    }
    let h = `<div class="line"><strong class="ok">Added ${d.added} newly licensed
      ${d.added===1?'agent':'agents'}</strong> <span class="dim">— ${d.rows_found} on the
      board, ${d.rows_recent} within ${d.days} days, ${d.duplicate_count} already in CRM ·
      <strong>${d.credits_spent} credits used</strong></span></div>`;
    (d.notes||[]).forEach(n => h += `<div class="line dim">${esc(n)}</div>`);
    (d.preview||[]).forEach(p => h +=
      `<div class="line">${esc(p.name)} <span class="dim">— ${esc(p.city||'?')}</span></div>`);
    if (d.added) h += `<div class="line" style="margin-top:8px">
      <a href="/leads?industry=real_estate_new" style="color:#60a5fa">
      View them in All Leads →</a></div>`;
    out('lOut', h);
    loadBudget();
  } catch(e){ out('lOut','<div class="line bad">Import failed</div>'); }
  finally { busy('lBtn', false, 'Import licensees'); }
}

function confClass(c){ return c>=75 ? 'c-hi' : c>=50 ? 'c-mid' : 'c-lo'; }

// A consensus run is many source calls. Each is driven as its own request so no
// single one approaches the serverless timeout, and progress stays visible.
async function discover(){
  busy('dBtn', true);
  const prog = document.getElementById('dProg');
  prog.style.display = 'block';
  document.getElementById('pFill').style.width = '0%';
  document.getElementById('pNote').textContent = 'Planning…';
  out('dOut', '');

  const body = {
    industry: dIndustry.value, city: dCity.value.trim(),
    state: dState.value, terms: parseInt(dTerms.value)||3,
  };

  try {
    const plan = await (await fetch('/api/research/plan', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)})).json();
    if (plan.error) { out('dOut', `<div class="line bad">${esc(plan.error)}</div>`); return; }

    const steps = plan.steps || [];
    let found = 0;
    for (let i = 0; i < steps.length; i++) {
      const s = steps[i];
      document.getElementById('pNote').textContent =
        `${i+1} / ${steps.length} — ${s.source.replace(/_/g,' ')}: "${s.term}" · ${found} candidates so far`;
      const r = await (await fetch('/api/research/step', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({step:s, pool_key:plan.pool_key})})).json();
      found += (r.found || 0);
      document.getElementById('pFill').style.width = ((i+1)/steps.length*100) + '%';
    }

    document.getElementById('pNote').textContent =
      `Clustering ${found} candidates and scoring consensus…`;

    const d = await (await fetch('/api/research/finalize', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({...body, pool_key: plan.pool_key,
                            mode: dMode.value,
                            min_sources: parseInt(dMinSources.value)||1})})).json();
    if (d.error) { out('dOut', `<div class="line bad">${esc(d.error)}</div>`); return; }

    let h = `<div class="line"><strong class="ok">Added ${d.added} new lead${d.added===1?'':'s'}</strong>
      <span class="dim"> — ${d.raw_candidates} raw results from ${d.sources_used.length} source${d.sources_used.length===1?'':'s'},
      clustered to ${d.clustered} businesses, ${d.rejected_low_confidence} below confidence,
      ${d.duplicate_count} already in CRM</span></div>`;

    h += `<div class="line dim">Per source: ` +
      Object.entries(d.per_source||{}).map(([k,v])=>`${esc(k.replace(/_/g,' '))} ${v}`).join(' · ') +
      `</div>`;

    (d.preview||[]).forEach(x => {
      h += `<div class="line">
        <span class="conf ${confClass(x.confidence)}">${x.confidence}</span>
        <strong style="margin-left:8px">${esc(x.business_name)}</strong>
        ${x.has_website ? '' : '<span class="warn" style="margin-left:6px">no website</span>'}
        <div class="srcs" style="margin-left:46px;margin-top:3px">
          ${x.source_count} source${x.source_count===1?'':'s'}: ${x.sources.map(esc).join(', ')}
          ${x.phone ? ' · '+esc(x.phone) : ''}
        </div>
        ${(x.conflicts||[]).map(c=>`<div class="flag" style="margin-left:46px">! ${esc(c)}</div>`).join('')}
      </div>`;
    });

    if (d.duplicate_count) {
      h += `<div class="line dim" style="margin-top:8px">Skipped as already in CRM:</div>`;
      (d.duplicates||[]).slice(0,10).forEach(x =>
        h += `<div class="line"><span class="warn">${esc(x.name)}</span>
              <span class="dim"> — ${esc(x.reason)}</span></div>`);
    }
    if ((d.rejected_preview||[]).length) {
      h += `<div class="line dim" style="margin-top:8px">Rejected below confidence:</div>`;
      d.rejected_preview.slice(0,10).forEach(x =>
        h += `<div class="line dim">${esc(x.business_name)} — ${esc(x.reason)}</div>`);
    }
    if (d.added) h += `<div class="line" style="margin-top:8px">
        <a href="/leads?industry=${encodeURIComponent(d.industry)}" style="color:#60a5fa">
        View them in All Leads →</a></div>`;
    out('dOut', h);
  } catch(e) {
    out('dOut', `<div class="line bad">Run failed: ${esc(String(e).slice(0,160))}</div>`);
  } finally {
    busy('dBtn', false, 'Run consensus search');
    document.getElementById('pNote').textContent = 'Done.';
  }
}

async function runAudit(){
  busy('aBtn', true);
  out('aOut', '<div class="line dim">Scraping and auditing…</div>');
  try {
    const r = await fetch('/api/research/batch', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({limit: parseInt(aLimit.value)||5,
                            industry: aIndustry.value || null})
    });
    const d = await r.json();
    if (d.error) { out('aOut', `<div class="line bad">${esc(d.error)}</div>`); return; }
    if (!d.researched && d.message) { out('aOut', `<div class="line dim">${esc(d.message)}</div>`); return; }

    let h = `<div class="line"><strong class="ok">Researched ${d.researched}</strong>`;
    if (d.failed) h += ` <span class="bad">· ${d.failed} failed</span>`;
    h += ` <span class="dim">· ${d.remaining} still unresearched</span></div>`;

    (d.results||[]).forEach(x => {
      if (!x.ok) { h += `<div class="line bad">${esc(x.business_name)} — ${esc(x.error)}</div>`; return; }
      h += `<div class="line">
        <span class="score ${gradeClass(x.grade)}">${x.score}</span>
        <strong style="margin-left:8px">${esc(x.business_name)}</strong>
        <div class="dim" style="margin-top:3px;margin-left:50px">${(x.top_gaps||[]).map(esc).join(' · ')||'No gaps found'}</div>
      </div>`;
    });
    if (d.remaining > 0) h += `<div class="line" style="margin-top:8px">
        <button class="btn ghost" onclick="runAudit()">Research next ${Math.min(d.remaining,5)}</button></div>`;
    out('aOut', h);
  } catch(e) { out('aOut', `<div class="line bad">Network error</div>`); }
  finally { busy('aBtn', false, 'Research next batch'); }
}

async function classifyAll(){
  out('aOut', '<div class="line dim">Classifying…</div>');
  const r = await fetch('/api/leads/classify-industries', {method:'POST'});
  const d = await r.json();
  let h = `<div class="line ok">Classified ${d.classified} leads by industry</div>`;
  (d.breakdown||[]).forEach(b => h +=
    `<div class="line">${esc(b.industry.replace(/_/g,' '))}
     <span class="dim"> — ${b.count} leads, avg need ${b.avg_need}</span></div>`);
  out('aOut', h);
}

async function findDupes(){
  out('aOut', '<div class="line dim">Scanning for duplicates…</div>');
  const r = await fetch('/api/leads/find-duplicates');
  const d = await r.json();
  let h = `<div class="line"><strong>${d.duplicate_count}</strong> duplicate
           ${d.duplicate_count===1?'lead':'leads'} in ${d.total} total</div>`;
  if (!d.duplicate_count) h += `<div class="line ok">Clean — no repeats.</div>`;
  (d.duplicates||[]).slice(0,30).forEach(x => h +=
    `<div class="line"><a href="/lead/${x.id}" style="color:#60a5fa">${esc(x.business_name)}</a>
     <span class="dim"> (${esc(x.city)}) — ${esc(x.reason)}</span></div>`);
  out('aOut', h);
}
</script>
