name: Render YouTube Short

on:
  push:
    paths:
      - 'clients/youtube/scripts/*.json'
      - 'execution/generate_short.py'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Script slug to render (filename without .json)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify Pexels secret is set
        run: |
          if [ -z "${{ secrets.PEXELS_API_KEY }}" ]; then
            echo "::error::PEXELS_API_KEY secret not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Determine which scripts to render
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            files="clients/youtube/scripts/${{ inputs.slug }}.json"
          else
            files=$(git diff --name-only HEAD^ HEAD -- 'clients/youtube/scripts/*.json' | tr '\n' ' ')
          fi
          echo "Files to render: $files"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Render shorts
        if: steps.pick.outputs.files != ''
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          for f in ${{ steps.pick.outputs.files }}; do
            [ -f "$f" ] || { echo "Skipping missing $f"; continue; }
            echo "::group::Rendering $f"
            python execution/generate_short.py --script-file "$f"
            echo "::endgroup::"
          done

      - name: Publish releases with download links
        if: steps.pick.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "## Rendered Shorts" >> "$GITHUB_STEP_SUMMARY"
          for f in ${{ steps.pick.outputs.files }}; do
            slug=$(basename "$f" .json)
            src="clients/youtube/$slug/base.mp4"
            if [ ! -f "$src" ]; then
              echo "No MP4 produced for $slug, skipping" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            dest="$slug.mp4"
            cp "$src" "$dest"
            tag="short-$slug-$(date +%Y%m%d-%H%M%S)"
            gh release create "$tag" "$dest" \
              --title "Short: $slug" \
              --notes "Auto-rendered from $f by GitHub Actions."
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$dest"
            echo "- **$slug**: [$dest]($url)" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Short ready::$slug -> $url"
          done
