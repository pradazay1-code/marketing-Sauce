<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Mindbloom Avatar A: Yellow M with bloom dot (recommended for TikTok/YT profile) -->
  <circle cx="250" cy="250" r="250" fill="#111111"/>
  <text x="250" y="355" text-anchor="middle"
        font-family="Anton, Impact, 'Archivo Black', sans-serif"
        font-weight="900" font-size="340" fill="#FFC700"
        letter-spacing="-12">M</text>
  <!-- 4-petal bloom in upper-right -->
  <g transform="translate(380 140)">
    <circle r="13" fill="#FFFFFF"/>
    <circle cx="-26" cy="0" r="11" fill="#FFC700"/>
    <circle cx="26" cy="0" r="11" fill="#FFC700"/>
    <circle cx="0" cy="-26" r="11" fill="#FFC700"/>
    <circle cx="0" cy="26" r="11" fill="#FFC700"/>
  </g>
</svg>
