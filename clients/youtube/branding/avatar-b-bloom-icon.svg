<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Mindbloom Avatar B: Pure bloom icon (no letter) - more distinctive, more abstract -->
  <circle cx="250" cy="250" r="250" fill="#FFC700"/>
  <!-- 5-petal stylized brain-bloom flower in center, black -->
  <g transform="translate(250 250)">
    <!-- Petals (5, evenly spaced) -->
    <g fill="#111111">
      <ellipse cx="0" cy="-95" rx="55" ry="90"/>
      <ellipse cx="0" cy="-95" rx="55" ry="90" transform="rotate(72)"/>
      <ellipse cx="0" cy="-95" rx="55" ry="90" transform="rotate(144)"/>
      <ellipse cx="0" cy="-95" rx="55" ry="90" transform="rotate(216)"/>
      <ellipse cx="0" cy="-95" rx="55" ry="90" transform="rotate(288)"/>
    </g>
    <!-- Center -->
    <circle r="40" fill="#FFC700"/>
    <circle r="18" fill="#111111"/>
  </g>
</svg>
